apis:
- aid: langchain:langsmith
  name: LangSmith API
  description: The LangSmith API is used to programmatically create and manage LangSmith
    resources including tracer sessions, datasets, examples, workspaces, audit logs,
    filter views, insights jobs, tags, and prompts. LangSmith is the agent engineering
    platform maintained by LangChain that provides observability, evaluation, and
    deployment tooling for LLM and agent applications. The API is OpenAPI 3.1 with
    345+ endpoints and uses an X-Api-Key header for authentication.
  humanURL: https://docs.langchain.com/langsmith
  baseURL: https://api.smith.langchain.com

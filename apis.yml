aid: langchain
name: LangChain
description: 'LangChain is a comprehensive ecosystem for building and deploying AI agents, consisting of open-source frameworks
  and an agent engineering platform called LangSmith. The company offers two main frameworks: LangChain, which enables rapid
  development with pre-built agent architectures and model integrations, and LangGraph, which provides low-level primitives
  for building custom agent workflows with greater control.'
